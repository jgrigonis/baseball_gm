<script>
(function() {

// Helpers that always look up fresh DOM refs
function getBtn()  { return document.getElementById('sched-play-btn'); }
function getStop() { return document.getElementById('sched-stop-btn'); }
function setStatus(msg, color) {
  var bar  = document.getElementById('sim-status');
  var text = document.getElementById('sim-status-text');
  if (!bar || !text) return;
  if (msg) {
    text.textContent = msg;
    bar.style.setProperty('display', 'flex', 'important');
    if (color) { bar.style.background = color === 'red' ? 'var(--red-lo, #2e0a0a)' : 'var(--green-dim)'; bar.style.borderColor = color === 'red' ? 'var(--red)' : 'var(--green-mid)'; text.style.color = color === 'red' ? 'var(--red)' : 'var(--green)'; }
  } else {
    bar.style.display = 'none';
  }
}

function setInjuryNews(msg) {
  var el = document.getElementById('sim-injury-news');
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function setSimMode(simming) {
  var btn    = getBtn();
  var btnInj = document.getElementById('sched-injury-btn');
  var btnSzn = document.getElementById('sched-season-btn');
  var stop   = getStop();
  if (btn)    { btn.disabled    = simming; btn.style.display    = simming ? 'none' : ''; }
  if (btnInj) { btnInj.disabled = simming; btnInj.style.display = simming ? 'none' : ''; }
  if (btnSzn) { btnSzn.disabled = simming; btnSzn.style.display = simming ? 'none' : ''; }
  if (stop)   { stop.style.display = simming ? 'inline-block' : 'none'; stop.textContent = '■ Stop'; }

  // Grey out tabs that don't update live during sim
  var liveTabs = ['standings', 'schedule', 'leaders'];
  document.querySelectorAll('.tab-link').forEach(function(link) {
    var href = link.getAttribute('href') || '';
    var isLive = liveTabs.some(function(t) { return href.indexOf('/' + t) !== -1; });
    if (simming && !isLive) {
      link.style.opacity = '0.35';
      link.style.pointerEvents = 'none';
    } else {
      link.style.opacity = '';
      link.style.pointerEvents = '';
    }
  });
}

// _simStop lives on window so it survives IIFE re-execution on tab refresh
if (typeof window._simStop === 'undefined') window._simStop = false;

async function schedSim(count) {
  // more dead code
  // var dd = document.getElementById('sched-dropdown');
  // if (dd) dd.style.display = 'none';

  window._simStop = false;
  setSimMode(count !== 1);

  var totalGames = 0;
  var remaining  = null;
  var daysSimmed = 0;

  while (!window._simStop) {
    setStatus('Simming day ' + (daysSimmed + 1) + '…' + (totalGames ? '  (' + totalGames + ' league games played)' : ''));

    try {
      var res = await fetch('/leagues/{{ league_id }}/sim', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({count: 1}),
      });
      var d = await res.json();
      if (!res.ok) { setStatus('✗ Server error', 'red'); break; }
      if (!d.games_played) {
        if (!d.games_remaining || d.games_remaining <= 0) break;
        setStatus('⚠ No games played', 'var(--amber)');
        break;
      }

      totalGames += d.games_played;
      remaining   = d.games_remaining;
      daysSimmed++;

      var statusMsg = '▶ Day ' + daysSimmed + ' done · ' + totalGames + ' games · ' + remaining + ' remaining';
      setStatus(statusMsg);

      // Build injury news
      var injNews = '';
      if (d.new_injuries && d.new_injuries.length > 0) {
        // old way, ES6 arrow below // injNews += d.new_injuries.map(function(i) { return '🚑 ' + i.name + ' (' + i.days + 'g)'; }).join('  ');
        injNews += d.new_injuries.map(i => `🚑 ${i.name} (${i.days}g)`).join('  ');
      }
      if (d.returned && d.returned.length > 0) {
        // old way, ES6 arrow below // injNews += (injNews ? '  ' : '') + d.returned.map(function(i) { return '✅ ' + i.name + ' returned'; }).join('  ');
        injNews += (injNews ? '  ' : '') + d.returned.map(i => `✅ ${i.name} returned`).join('  ');
      }
      setInjuryNews(injNews);  // clears if empty, shows if not

      // Stop on injury — read from window._stopOnInjury which persists across tab re-renders
      if (injNews && (count === 'injury')) {
        window._simStop = true;
      }

      // Update topbar date
      if (d.current_date) {
        var dateEl = document.querySelector('.topbar-date');
        if (dateEl) dateEl.textContent = d.current_date;
      }

      // Update topbar state badge if league state changed
      if (d.league_state) {
        var badge = document.querySelector('.topbar-state');
        if (badge) {
          var prevState = badge.textContent.trim();
          badge.textContent = d.league_state;
          badge.className = 'topbar-state state-' + d.league_state;
          var tabChangingStates = ['playoffs', 'offseason', 'draft'];
          if (prevState !== d.league_state && tabChangingStates.includes(d.league_state)) {
            window.location.href = window.location.href;
            return;
          }
        }
      }

      // Always refresh the tab so standings/schedule show current state
      var activeLink = document.querySelector('.tab-link.active');
      if (activeLink) {
        var url = activeLink.getAttribute('hx-get') || activeLink.getAttribute('href');
        // Remember any sub-pane state before swapping HTML
        var lbPane = null;
        var lbBatEl = document.getElementById('lb-pane-batting');
        if (lbBatEl) lbPane = lbBatEl.style.display === 'none' ? 'pitching' : 'batting';
        try {
          var tabRes = await fetch(url, {headers: {'HX-Request': 'true'}});
          var html = await tabRes.text();
          var tc = document.getElementById('tab-content');
          if (tc) {
            tc.innerHTML = html;
            // Restore leaders pane if needed
            if (lbPane && lbPane !== 'batting' && typeof lbSwitch === 'function') {
              lbSwitch(lbPane);
            }
          }
        } catch(e) {}
      }
      // Only re-enter sim mode if we're continuing
      if (!window._simStop && count !== 1) setSimMode(true);

      if (remaining <= 0) break;
      if (count !== 'season' && count !== 'injury' && daysSimmed >= count) break;

    } catch(err) {
      setStatus('✗ Error', 'red');
      console.error(err);
      break;
    }
  }

  // Done
  setSimMode(false);
  if (remaining !== null) {
    setStatus('✓ ' + daysSimmed + ' days · ' + totalGames + ' games · ' + remaining + ' remaining');
  } else {
    setStatus('');
  }
}
window.schedSim = schedSim;

function schedStop() {
  window._simStop = true;
  var stop = getStop();
  if (stop) stop.textContent = 'Stopping…';
}
window.schedStop = schedStop;
