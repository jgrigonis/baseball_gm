{# src/web/templates/landing.html — sign in #}
{% extends "auth_base.html" %}
{% block form %}
  <form method="POST" action="/auth/login" style="display:flex;flex-direction:column;gap:12px;">
    <p class="auth-heading">Sign in</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" value="{{ username or '' }}" maxlength="30" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" maxlength="128" autocomplete="current-password" required>
    </div>
    <p class="auth-forgot"><a href="/auth/forgot">Forgot your password?</a></p>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
      Sign In →
    </button>
  </form>
  <p class="auth-switch">New here? <a href="/signup">Create an account</a></p>
{% endblock %}
