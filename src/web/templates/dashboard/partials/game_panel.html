{# templates/dashboard/partials/game_panel.html #}
{# Slide-in game detail panel — always in DOM, shown/hidden via JS #}

<div id="game-panel-overlay"
     onclick="closeGamePanel()"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;"></div>

<div id="game-panel"
     style="display:none;position:fixed;top:0;right:0;width:min(720px,95vw);height:100vh;
            background:var(--bg-2);border-left:1px solid var(--border);
            overflow-y:auto;z-index:201;flex-direction:column;">

  {# Header — populated by JS fetch #}
  <div id="game-panel-header"
       style="padding:16px 20px 14px;border-bottom:1px solid var(--border);
              display:flex;align-items:center;gap:12px;position:sticky;top:0;
              background:var(--bg-2);z-index:1;">
    <div style="flex:1;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">
      Select a game to view details
    </div>
    <button onclick="closeGamePanel()"
            style="background:none;border:1px solid var(--border);color:var(--text-dim);
                   font-size:18px;cursor:pointer;padding:4px 10px;border-radius:3px;">×</button>
  </div>

  {# Content — replaced by JS fetch #}
  <div id="game-panel-content" style="padding:16px 20px 32px;"></div>

</div>
