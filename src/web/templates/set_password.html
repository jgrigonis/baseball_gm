{# src/web/templates/set_password.html #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set a password — GM Sim</title>
  <link rel="stylesheet" href="{{ static_url('css/main.css') }}">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
<div style="text-align:center;max-width:400px;width:100%;padding:40px;">
  <div style="font-family:var(--font-display);text-transform:uppercase;font-size:48px;color:var(--amber);letter-spacing:.04em;line-height:1;">Secure your GM</div>
  <p style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:16px 0 32px;line-height:1.8;">
    GM Sim now uses passwords. Choose a username and password to keep your
    leagues and teams. You'll use them to sign in from now on.
  </p>
  <form method="POST" action="/auth/set-password" style="display:flex;flex-direction:column;gap:12px;">
    {% if error %}<div style="font-family:var(--font-mono);font-size:12px;color:var(--red);text-align:left;">{{ error }}</div>{% endif %}
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" value="{{ username or '' }}" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]+" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" name="confirm" minlength="8" maxlength="128" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
      Save →
    </button>
  </form>
</div>
</body>
</html>
