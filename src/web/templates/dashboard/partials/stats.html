{# templates/dashboard/partials/stats.html #}
{# ── Stats Tab ─────────────────────────────────────────────────────────────── #}

<div style="position:sticky;top:0;z-index:10;background:var(--bg);
            padding:10px 24px;border-bottom:1px solid var(--border);">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;">
    <h1 class="page-title" style="white-space:nowrap;">Stats</h1>

    <select id="team-select" onchange="switchTeam(this.value)"
            style="font-family:var(--font-mono);font-size:12px;padding:4px 8px;max-width:160px;">
      {% for t in all_teams %}
      <option value="{{ t.id }}" {% if t.id == selected_team_id %}selected{% endif %}>
        {{ t.city }} {{ t.mascot }}{% if t.id == my_team_id %} ★{% endif %}
      </option>
      {% endfor %}
    </select>

    <select id="season-select" onchange="switchSeason(this.value)"
            style="font-family:var(--font-mono);font-size:12px;padding:4px 8px;max-width:80px;">
      {% for s in all_seasons %}
      <option value="{{ s.id }}" {% if s.id == selected_season_id %}selected{% endif %}>
        {{ s.year }}
      </option>
      {% endfor %}
    </select>

    <div style="display:flex;gap:0;border:1px solid var(--border);">
      <button onclick="switchPostseason(0)"
              style="padding:4px 10px;font-family:var(--font-mono);font-size:11px;
                     border:none;cursor:pointer;
                     background:{% if not is_postseason %}var(--green-dim){% else %}transparent{% endif %};
                     color:{% if not is_postseason %}var(--green){% else %}var(--text-dim){% endif %};">
        Reg
      </button>
      <button onclick="switchPostseason(1)"
              style="padding:4px 10px;font-family:var(--font-mono);font-size:11px;
                     border:none;border-left:1px solid var(--border);cursor:pointer;
                     background:{% if is_postseason %}var(--green-dim){% else %}transparent{% endif %};
                     color:{% if is_postseason %}var(--green){% else %}var(--text-dim){% endif %};">
        Playoff
      </button>
    </div>

    <div style="display:flex;gap:0;border:1px solid var(--border);">
      <button id="btn-bat" onclick="showCategory('batting')"
              style="padding:4px 10px;font-family:var(--font-mono);font-size:11px;
                     background:var(--green-dim);color:var(--green);border:none;cursor:pointer;">
        Bat
      </button>
      <button id="btn-pit" onclick="showCategory('pitching')"
              style="padding:4px 10px;font-family:var(--font-mono);font-size:11px;
                     background:transparent;color:var(--text-dim);border:none;cursor:pointer;
                     border-left:1px solid var(--border);">
        Pit
      </button>
      <button id="btn-def" onclick="showCategory('defense')"
              style="padding:4px 10px;font-family:var(--font-mono);font-size:11px;
                     background:transparent;color:var(--text-dim);border:none;cursor:pointer;
                     border-left:1px solid var(--border);">
        Def
      </button>
    </div>

    <button id="btn-hide-pit" onclick="toggleHidePitchers()"
            style="display:none;padding:4px 10px;font-family:var(--font-mono);font-size:11px;white-space:nowrap;
                   background:transparent;color:var(--text-dim);border:1px solid var(--border);cursor:pointer;">
      Hide P
    </button>
    <span id="stats-count" style="font-family:var(--font-mono);font-size:11px;white-space:nowrap;
                                   color:var(--text-dim);margin-left:auto;"></span>
  </div>
</div>

<div id="stats-scroll" style="padding:0 24px 32px;overflow-y:auto;overflow-x:auto;">
  <table id="stats-table" class="data-table" style="width:100%;white-space:nowrap;font-size:12px;">
    <thead id="stats-head"></thead>
    <tbody id="stats-body"></tbody>
  </table>
  <div id="stats-empty" style="display:none;padding:40px 0;text-align:center;
       font-family:var(--font-mono);font-size:13px;color:var(--text-dim);">
    No stats available yet.
  </div>
</div>

<script>
(function() {

var LEAGUE_ID          = "{{ league_id }}";
var STATS_POSTSEASON   = {{ "true" if is_postseason else "false" }};
var MY_TEAM_ID      = "{{ my_team_id or '' }}";
var TEAM_GAMES      = {{ team_games }};
var MIN_AB          = Math.floor(3.1 * TEAM_GAMES);
var MIN_OUTS        = 3 * TEAM_GAMES;

var BATTERS   = {{ batters  | tojson }};
var PITCHERS  = {{ pitchers | tojson }};
var FIELDERS  = {{ fielders | tojson }};

var category    = 'batting';
var sortKey     = 'AVG';
var sortAsc     = false;
var hidePitchers = false;

var BAT_COLS = [
  {key:'name',  label:'Player',  fmt:null,    rate:false, asc:true},
  {key:'G',     label:'G',       fmt:null,    rate:false},
  {key:'AB',    label:'AB',      fmt:null,    rate:false},
  {key:'H',     label:'H',       fmt:null,    rate:false},
  {key:'2B',    label:'2B',      fmt:null,    rate:false},
  {key:'3B',    label:'3B',      fmt:null,    rate:false},
  {key:'HR',    label:'HR',      fmt:null,    rate:false},
  {key:'RBI',   label:'RBI',     fmt:null,    rate:false},
  {key:'R',     label:'R',       fmt:null,    rate:false},
  {key:'BB',    label:'BB',      fmt:null,    rate:false},
  {key:'K',     label:'K',       fmt:null,    rate:false},
  {key:'SB',    label:'SB',      fmt:null,    rate:false},
  {key:'AVG',   label:'AVG',     fmt:'avg',   rate:true},
  {key:'OBP',   label:'OBP',     fmt:'avg',   rate:true},
  {key:'SLG',   label:'SLG',     fmt:'avg',   rate:true},
  {key:'OPS',   label:'OPS',     fmt:'avg',   rate:true},
  {key:'AB_K',  label:'AB/K',    fmt:'era',   rate:true, asc:false},
  {key:'HR_AB', label:'HR/AB',   fmt:'avg',   rate:true, asc:false},
];

var PIT_COLS = [
  {key:'name',  label:'Player',  fmt:null,    rate:false, asc:true},
  {key:'G',     label:'G',       fmt:null,    rate:false},
  {key:'GS',    label:'GS',      fmt:null,    rate:false},
  {key:'W',     label:'W',       fmt:null,    rate:false},
  {key:'L',     label:'L',       fmt:null,    rate:false},
  {key:'SV',    label:'SV',      fmt:null,    rate:false},
  {key:'IP',    label:'IP',      fmt:'ip',    rate:false},
  {key:'H',     label:'H',       fmt:null,    rate:false},
  {key:'ER',    label:'ER',      fmt:null,    rate:false},
  {key:'BB',    label:'BB',      fmt:null,    rate:false},
  {key:'K',     label:'K',       fmt:null,    rate:false},
  {key:'HR',    label:'HR',      fmt:null,    rate:false},
  {key:'ERA',   label:'ERA',     fmt:'era',   rate:true},
  {key:'WHIP',  label:'WHIP',    fmt:'era',   rate:true},
  {key:'BB9',   label:'BB/9',    fmt:'era',   rate:true},
  {key:'HR9',   label:'HR/9',    fmt:'era',   rate:true},
  {key:'K9',    label:'K/9',     fmt:'era',   rate:true},
];

var DEF_COLS = [
  {key:'name',  label:'Player', fmt:null,   rate:false, asc:true},
  {key:'pos',   label:'Pos',    fmt:null,   rate:false, asc:true},
  {key:'G',     label:'G',      fmt:null,   rate:false},
  {key:'PO',    label:'PO',     fmt:null,   rate:false},
  {key:'A',     label:'A',      fmt:null,   rate:false},
  {key:'E',     label:'E',      fmt:null,   rate:false},
  {key:'PB',    label:'PB',     fmt:null,   rate:false},
  {key:'FPCT',  label:'FPCT',   fmt:'avg',  rate:true},
];

function fmtVal(val, fmt) {
  if (val === null || val === undefined) return '—';
  if (fmt === 'avg') return val.toFixed(3);
  if (fmt === 'era') return val.toFixed(2);
  if (fmt === 'ip')  return val;
  return String(val);
}

function sortVal(row, key) {
  if (key === 'name' || key === 'pos') return row[key] || '';
  if (key === 'IP')   return row.IP_val || 0;
  if (key === 'AB_K') return row.AB_K || 0;
  if (key === 'HR_AB') return row.HR_AB || 0;
  var v = row[key];
  return (v === null || v === undefined) ? -999 : v;
}

function showCategory(cat) {
  category = cat;
  sortKey  = cat === 'batting' ? 'AVG' : cat === 'pitching' ? 'ERA' : 'FPCT';
  sortAsc  = cat === 'pitching';
  var cats = ['batting', 'pitching', 'defense'];
  var btns = ['btn-bat', 'btn-pit', 'btn-def'];
  cats.forEach(function(c, i) {
    var on = c === cat;
    document.getElementById(btns[i]).style.background = on ? 'var(--green-dim)' : 'transparent';
    document.getElementById(btns[i]).style.color      = on ? 'var(--green)'     : 'var(--text-dim)';
  });
  document.getElementById('btn-hide-pit').style.display = cat === 'defense' ? '' : 'none';
  renderTable();
}

function toggleHidePitchers() {
  hidePitchers = !hidePitchers;
  var btn = document.getElementById('btn-hide-pit');
  btn.style.background = hidePitchers ? 'var(--green-dim)' : 'transparent';
  btn.style.color      = hidePitchers ? 'var(--green)'     : 'var(--text-dim)';
  renderTable();
}

function setSort(key, defaultAsc) {
  if (sortKey === key) {
    sortAsc = !sortAsc;
  } else {
    sortKey = key;
    sortAsc = defaultAsc !== undefined ? defaultAsc : false;
  }
  renderTable();
}

function renderTable() {
  var cols = category === 'batting' ? BAT_COLS : category === 'pitching' ? PIT_COLS : DEF_COLS;
  var rows = category === 'batting' ? BATTERS  : category === 'pitching' ? PITCHERS : FIELDERS;
  if (category === 'defense' && hidePitchers) rows = rows.filter(function(r) { return r.pos !== 'P'; });


  rows = rows.slice().sort(function(a, b) {
    var av = sortVal(a, sortKey);
    var bv = sortVal(b, sortKey);
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });

  // Header
  var headHtml = '<tr>';
  cols.forEach(function(col) {
    var arrow = sortKey === col.key ? (sortAsc ? ' ↑' : ' ↓') : '';
    var defaultAsc = col.asc !== undefined ? col.asc : (col.key === 'ERA' || col.key === 'BB9' || col.key === 'HR9' || col.key === 'WHIP');
    headHtml += '<th style="cursor:pointer;user-select:none;text-align:'
      + (col.key==='name'||col.key==='pos'?'left':'right') + ';white-space:nowrap;position:sticky;top:0;z-index:3;background:var(--bg-2);box-shadow:0 1px 0 var(--border);"'
      + ' onclick="setSort(\'' + col.key + '\',' + defaultAsc + ')">' 
      + col.label + arrow + '</th>';
  });
  headHtml += '</tr>';
  document.getElementById('stats-head').innerHTML = headHtml;

  // Body
  var empty = document.getElementById('stats-empty');
  if (!rows.length) {
    document.getElementById('stats-table').style.display = 'none';
    empty.style.display = 'block';
    document.getElementById('stats-count').textContent = '0 players';
    return;
  }
  document.getElementById('stats-table').style.display = '';
  empty.style.display = 'none';
  document.getElementById('stats-count').textContent = rows.length + ' players';

  var bodyHtml = '';
  rows.forEach(function(row) {
    bodyHtml += '<tr onclick="openPlayerPanel(\'' + row.player_id + '\')" style="cursor:pointer;"'
      + ' onmouseover="this.style.background=\'var(--bg-3)\'"'
      + ' onmouseout="this.style.background=\'\'">';
    cols.forEach(function(col) {
      var isName = col.key === 'name' || col.key === 'pos';
      var isRate = col.rate;
      var unqual = isRate && !row.qualified;
      var color = unqual ? 'var(--text-dim)' : (isRate ? 'var(--amber)' : '');
      var title = unqual ? ' title="Below qualification threshold"' : '';
      var style = 'text-align:' + (isName?'left':'right') + ';font-family:var(--font-mono);';
      if (color) style += 'color:' + color + ';';
      if (unqual) style += 'font-style:italic;';
      if (isRate && !unqual) style += 'font-weight:600;';
      var val = fmtVal(row[col.key], col.fmt);
      if (isName && row.injured) {
        var ilLabel = row.injury_days
          ? ' <span style="font-size:10px;color:var(--red);">IL (' + row.injury_days + 'd)</span>'
          : ' <span style="font-size:10px;color:var(--red);">IL</span>';
        val = '<span style="color:var(--red);">' + val + '</span>' + ilLabel;
      }
      bodyHtml += '<td style="' + style + '"' + title + '>' + val + '</td>';
    });
    bodyHtml += '</tr>';
  });
  document.getElementById('stats-body').innerHTML = bodyHtml;
}

function statsUrl(teamId, seasonId, ps) {
  var t = teamId  || document.getElementById('team-select').value;
  var s = seasonId|| document.getElementById('season-select').value;
  var p = (ps !== undefined) ? ps : (STATS_POSTSEASON ? 1 : 0);
  return '/leagues/' + LEAGUE_ID + '/stats?team_id=' + t + '&season_id=' + s + '&postseason=' + p;
}
function switchTeam(teamId) {
  htmx.ajax('GET', statsUrl(teamId), {target: '#tab-content', swap: 'innerHTML'});
}
function switchSeason(seasonId) {
  htmx.ajax('GET', statsUrl(null, seasonId), {target: '#tab-content', swap: 'innerHTML'});
}
function switchPostseason(ps) {
  htmx.ajax('GET', statsUrl(null, null, ps), {target: '#tab-content', swap: 'innerHTML'});
}

// Init
function sizeStatsScroll() {
  var wrapper = document.getElementById('stats-scroll');
  if (!wrapper) return;
  var top = wrapper.getBoundingClientRect().top;
  wrapper.style.height = (window.innerHeight - top - 8) + 'px';
}
sizeStatsScroll();
window.addEventListener('resize', sizeStatsScroll);
renderTable();

window.setSort          = setSort;
window.showCategory     = showCategory;
window.toggleHidePitchers = toggleHidePitchers;
window.switchTeam       = switchTeam;
window.switchSeason     = switchSeason;
window.switchPostseason = switchPostseason;
window.renderTable      = renderTable;

})();
</script>
