<script>
(function() {
function schedToggleDropdown() {
  var dd = document.getElementById('sched-dropdown');
  if (!dd) return;
  dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
}
window.schedToggleDropdown = schedToggleDropdown;

async function schedSim(count) {
  var dd  = document.getElementById('sched-dropdown');
  var btn = document.getElementById('sched-play-btn');
  var fb  = document.getElementById('sched-feedback');
  if (dd)  dd.style.display = 'none';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Simming…'; }
  if (fb)  { fb.style.display = 'inline'; fb.textContent = ''; }
  try {
    var res = await fetch('/leagues/{{ league_id }}/sim', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({count: count}),
    });
    var d = await res.json();
    if (res.ok) {
      var gp = d.games_played, gr = d.games_remaining;
      if (fb) {
        fb.textContent = '✓ ' + gp + ' game' + (gp !== 1 ? 's' : '') + ' · ' + gr + ' remaining';
        fb.style.color = 'var(--green)';
        fb.style.display = 'inline';
        // Persist until page change — no timeout
      }
      var o3 = document.getElementById('sopt-3'), o10 = document.getElementById('sopt-10');
      if (o3)  o3.disabled  = gr <= 3;
      if (o10) o10.disabled = gr <= 10;
      // Refresh current tab
      var activeLink = document.querySelector('.tab-link.active');
      if (activeLink) {
        var url = activeLink.getAttribute('hx-get') || activeLink.getAttribute('href');
        fetch(url, {headers: {'HX-Request': 'true'}})
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var tc = document.getElementById('tab-content');
            if (tc) tc.innerHTML = html;
          });
      }
    } else {
      if (fb) { fb.textContent = '✗ Sim failed'; fb.style.color = 'var(--red)'; fb.style.display = 'inline'; }
    }
  } catch(err) {
    if (fb) { fb.textContent = '✗ Error'; fb.style.color = 'var(--red)'; fb.style.display = 'inline'; }
    console.error(err);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '▶ Play'; }
  }
}
window.schedSim = schedSim;

document.addEventListener('click', function(e) {
  var wrap = document.getElementById('play-wrap');
  var dd   = document.getElementById('sched-dropdown');
  if (wrap && dd && !wrap.contains(e.target)) dd.style.display = 'none';
});
})();
</script>
