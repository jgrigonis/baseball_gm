name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseball_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/baseball_manager_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked ruff check src tests scripts

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Test
        run: uv run --locked pytest -q
