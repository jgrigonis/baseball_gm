[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball_manager"
version = "0.5.6"
description = "A baseball simulator"
authors = [
  { name = "Joshua Grigonis", email = "josh.grigonis@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
  "numpy>=2.5",
  "scipy>=1.18",
  "pydantic-settings>=2.16",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "jinja2>=3.1.6",
  # Needed by FastAPI's Form() even though nothing imports it directly.
  "python-multipart>=0.0.32",
  "psycopg[binary]>=3.3",
  # Not imported yet; reserved for password hashing.
  "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.17",
  "httpx>=0.28",
  "pytest>=9.1",
  "ruff>=0.17",
]

[tool.uv]
# Older uv versions fail with a clear error instead of misreading uv.lock.
required-version = ">=0.11"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (run with -m slow)",
    "veryslow: marks tests that take a significantly long time to run (run with -m veryslow)"
]

[tool.ruff.lint]
# Pyflakes checks (F) plus syntax errors (E9).
select = ["F", "E9"]

[tool.setuptools.packages.find]
where = ["."]
