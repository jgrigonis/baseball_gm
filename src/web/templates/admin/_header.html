{# The admin pages' tabs, and the note or error from the last form. #}
<div class="admin-tabs">
  <a href="/admin/leagues" class="btn btn-secondary admin-small {% if section == 'leagues' %}active{% endif %}">Leagues</a>
  <a href="/admin/users" class="btn btn-secondary admin-small {% if section == 'users' %}active{% endif %}">Users</a>
  <a href="/admin/personas" class="btn btn-secondary admin-small {% if section == 'personas' %}active{% endif %}">Personas</a>
</div>
{% if note %}<div class="admin-note">{{ note }}</div>{% endif %}
{% if error %}<div class="admin-error">{{ error }}</div>{% endif %}
