<style>
  .ct-card { margin-bottom: 16px; }
  .ct-card-title { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px 6px; }
  .ct-table td, .ct-table th { white-space: nowrap; }
  .ct-edited { color: var(--amber); margin-left: 4px; font-size: 12px; }
  .data-table tbody td.num.ct-edited-val { color: var(--amber); font-weight: 600; }
  .ct-table a { color: var(--text); text-decoration: none; }
  .ct-table a:hover { color: var(--amber); text-decoration: underline; }
  .ct-remove { background: none; border: none; color: var(--red); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 6px; }
  .ct-summary { font-family: var(--font-mono); font-size: 12px; margin: 0 0 12px; }
  .ct-needs { color: var(--amber); }
  .ct-ready { color: var(--green); }
  .ct-more { font-family: var(--font-mono); font-size: 11px; padding: 8px 14px; margin: 0; }

  .ct-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 14px; }

  .ct-skills input { width: 100%; }
  .ct-skills .hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
  .ct-skills .changed input { border-color: var(--amber); }
