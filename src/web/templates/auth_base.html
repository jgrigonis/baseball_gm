{# src/web/templates/auth_base.html — shared frame for the sign in and sign up pages #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}GM Sim{% endblock %}</title>
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <style>
    .auth-error { font-family:var(--font-mono);font-size:12px;color:var(--red);text-align:left; }
    .auth-heading { font-family:var(--font-mono);font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin:0; }
    .auth-switch { font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:24px; }
    .auth-switch a { color:var(--amber); }
    .auth-note { font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:0;line-height:1.8;text-align:left; }
    .auth-forgot { font-family:var(--font-mono);font-size:11px;text-align:right;margin:-4px 0 0; }
    .auth-forgot a { color:var(--text-dim); }
    .field-optional { color:var(--text-dim);text-transform:none;letter-spacing:0; }
  </style>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
<div style="text-align:center;max-width:400px;width:100%;padding:40px;">
  <div style="font-family:var(--font-display);font-size:64px;color:var(--amber);letter-spacing:.04em;line-height:1;">⚾<br>GM Sim</div>
  <p style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:16px 0 32px;line-height:1.8;">
    Manage a franchise. Build a roster. Win a championship.
  </p>
  {% block form %}{% endblock %}
</div>
</body>
</html>
