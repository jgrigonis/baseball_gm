{# src/web/templates/dashboard/partials/_play_script.html
   The regular season's sims, run from the top bar's next-move button
   (_next_move.html): Play Day, Until Injury, Full Season, Stop. Included
   once by the shell. #}
<script>
(function() {

// Helpers that always look up fresh DOM refs
function getBtn()  { return document.getElementById('sched-play-btn'); }
function getStop() { return document.getElementById('sched-stop-btn'); }
// oneLine: the running "Simming day N…" line stays on one line and is cut
// short with "…" on a phone instead of wrapping; results can wrap.
function setStatus(msg, color, oneLine) {
  var bar  = document.getElementById('sim-status');
  var text = document.getElementById('sim-status-text');
  if (!bar || !text) return;
  text.classList.toggle('sim-status-one-line', !!oneLine);
  if (msg) {
    text.textContent = msg;
    bar.style.setProperty('display', 'flex', 'important');
    if (color) { bar.style.background = color === 'red' ? 'var(--red-lo, #2e0a0a)' : 'var(--green-dim)'; bar.style.borderColor = color === 'red' ? 'var(--red)' : 'var(--green-mid)'; text.style.color = color === 'red' ? 'var(--red)' : 'var(--green)'; }
  } else {
    bar.style.display = 'none';
  }
}


function setSimMode(simming) {
  // The top bar's next-move button turns into Stop while a sim runs.
  var nm = document.getElementById('next-move');
  if (nm) nm.classList.toggle('nm-simming', simming);
  var stop = getStop();
  if (stop) stop.textContent = '■ Stop';
  // A run that ignores trades is over: offers pop up again.
  if (!simming) window._simIgnoringTrades = false;
  // Every tab stays open during a sim: the server turns away moves that
  // would race a day's games (league_lock), and the open tab reloads after
  // each day unless it holds unsaved edits (shell.html _simHold).
}

// The playoffs' Sim Round and Full Playoffs (playoffs.html) use it too.
window.schedSetSimMode = setSimMode;

// _simStop lives on window so it survives IIFE re-execution on tab refresh
if (typeof window._simStop === 'undefined') window._simStop = false;

// "Stop for trade offers" and "Stop at the trade deadline": whether
// multi-day runs stop the day an offer arrives, and after the deadline
// day's games. Unchecked, they play on: offers stay pending (they expire as
// usual) and nothing is declined for the GM. Both start checked and are
// remembered per browser. The old "Ignore trades" box (one key for both)
// carries over the first time.
var STOP_OFFERS_KEY = 'sim-stop-offers-{{ league_id }}';
var STOP_DEADLINE_KEY = 'sim-stop-deadline-{{ league_id }}';
var OLD_IGNORE_TRADES_KEY = 'sim-ignore-trades-{{ league_id }}';
function schedTradeStop(key, cache) {
  if (typeof window[cache] === 'boolean') return window[cache];
  try {
    var v = localStorage.getItem(key);
    if (v === null) v = localStorage.getItem(OLD_IGNORE_TRADES_KEY) === '1' ? '0' : '1';
    return v === '1';
  } catch (e) { return true; }
}
function schedSetTradeStop(key, cache, on) {
  window[cache] = !!on;
  try { localStorage.setItem(key, on ? '1' : '0'); } catch (e) {}
  schedUpdateStops();
}
function schedStopOffers() { return schedTradeStop(STOP_OFFERS_KEY, '_stopOffers'); }
function schedStopDeadline() { return schedTradeStop(STOP_DEADLINE_KEY, '_stopDeadline'); }
window.schedSetStopOffers = function(on) { schedSetTradeStop(STOP_OFFERS_KEY, '_stopOffers', on); };
window.schedSetStopDeadline = function(on) { schedSetTradeStop(STOP_DEADLINE_KEY, '_stopDeadline', on); };

// "Stop for All-Star breaks" unchecked: multi-day runs don't stop when the
// ballot opens, when the All-Stars are named or after the weekend. The
// scouts cast an unsaved ballot and make a captain's picks, and the weekend
// is played on the way. Remembered per browser (stored as "through the
// break", the box's opposite, as it was before the box was flipped).
var THROUGH_BREAK_KEY = 'sim-through-break-{{ league_id }}';
function schedThroughBreak() {
  if (typeof window._throughBreak === 'boolean') return window._throughBreak;
  try { return localStorage.getItem(THROUGH_BREAK_KEY) === '1'; } catch (e) { return false; }
}
function schedSetThroughBreak(on) {
  window._throughBreak = !!on;
  try { localStorage.setItem(THROUGH_BREAK_KEY, on ? '1' : '0'); } catch (e) {}
  schedUpdateStops();
}
window.schedThroughBreak = schedThroughBreak;
window.schedSetThroughBreak = schedSetThroughBreak;

// Full Season's note says where it will stop: the first of the season's
// stops (next_move.sim_stops) that the boxes above don't skip.
var ALL_STAR_STOPS = ['vote', 'stars', 'weekend'];
function schedUpdateStops() {
  var item = document.getElementById('sched-season-btn');
  var note = item && item.querySelector('.nm-note');
  if (!note || !item.dataset.stops) return;
  var skipStars = !!document.getElementById('sched-stop-allstar-box') && schedThroughBreak();
  var skipDeadline = !!document.getElementById('sched-stop-deadline-box') && !schedStopDeadline();
  var stops = [];
  try { stops = JSON.parse(item.dataset.stops); } catch (e) { return; }
  var next = stops.find(function(s) {
    if (skipStars && ALL_STAR_STOPS.indexOf(s.kind) >= 0) return false;
    if (skipDeadline && s.kind === 'deadline') return false;
    return true;
  });
  if (next) note.textContent = next.note;
}
// The boxes start as this browser left them (and again whenever the
// next-move button reloads: refreshNextMove calls this).
function schedSyncBoxes() {
  var offers = document.getElementById('sched-stop-offers-box');
  if (offers) offers.checked = schedStopOffers();
  var dl = document.getElementById('sched-stop-deadline-box');
  if (dl) dl.checked = schedStopDeadline();
  var brk = document.getElementById('sched-stop-allstar-box');
  if (brk) brk.checked = !schedThroughBreak();
  schedUpdateStops();
}
window.schedSyncBoxes = schedSyncBoxes;
schedSyncBoxes();

// The GM's own team over a run, for the line under the sim buttons: the
// run's record, the season record, the standing, the playoff race late on,
// and the run's biggest story about the team (src/api/services/sim_summary.py).
function newRunSummary() {
  return {w: 0, l: 0, last: null, story: null, injury: null};
}
function addToRun(run, d) {
  var t = d.my_team;
  if (t && t.wins !== undefined) {
    run.w += t.day_wins || 0;
    run.l += t.day_losses || 0;
    run.last = t;
    // The biggest story wins; a later one wins a tie.
    if (t.story && (!run.story || t.story.weight >= run.story.weight)) run.story = t.story;
  }
  // The longest injury of the run, when it's more than a few days.
  (d.new_injuries || []).forEach(function (i) {
    if (i.days >= 10 && (!run.injury || i.days > run.injury.days)) run.injury = i;
  });
}
// "3-1 (42-31) · 1st in East by 2.5", plus the race and games left late on.
function runRecordText(run) {
  var t = run.last;
  if (!t) return '';
  var span = run.w + run.l ? run.w + '-' + run.l : 'Off';
  var parts = [span + ' (' + t.wins + '-' + t.losses + ')', t.standing];
  if (t.race) parts.push(t.race);
  if (t.games_left > 0 && t.games_left <= 20) parts.push(t.games_left + (t.games_left === 1 ? ' game left' : ' games left'));
  return parts.join(' · ');
}
// One notable thing from the run: the biggest story, or a long injury.
function runNotable(run) {
  if (run.story) return run.story.headline;
  if (run.injury) return '🚑 ' + run.injury.name + ' to the IL (' + run.injury.days + 'd)';
  return '';
}

async function schedSimRun(count) {
  window._simStop = false;
  setSimMode(count !== 1);
  // Only multi-day runs skip trade stops; a single day stops anyway.
  var multi = count !== 1;
  var skipOffers = multi && !!document.getElementById('sched-stop-offers-box') && !schedStopOffers();
  var skipDeadline = multi && !!document.getElementById('sched-stop-deadline-box') && !schedStopDeadline();
  // While it runs past offers, trade offers and votes go in the news bar
  // instead of popping up: the sim won't stop for them, so the card would
  // only flash.
  window._simIgnoringTrades = skipOffers;
  // Multi-day runs can also play straight through the All-Star break.
  var throughBreak = count !== 1 && !!document.getElementById('sched-stop-allstar-box') && schedThroughBreak();
  var weekendPlayed = false;

  var totalGames = 0;
  var remaining  = null;
  var daysSimmed = 0;
  var run = newRunSummary();

  // "Simming day 94… · 3-1 (42-31) · 1st in East by 2.5": the day being
  // played, with the team's line through the last finished day (none yet
  // on day 1). One line, so nothing flashes between two messages.
  function simmingText() {
    var record = runRecordText(run);
    var msg = 'Simming day ' + (daysSimmed + 1) + '…';
    if (record) return msg + ' · ' + record;
    return msg + (totalGames ? '  (' + totalGames + ' league games played)' : '');
  }

  while (!window._simStop) {
    setStatus(simmingText(), null, true);

    try {
      var dayMsg = simmingText();
      var d = await runLeagueJob('/leagues/{{ league_id }}/sim', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({count: 1}),
      }, function(job) { setStatus(leagueJobWaitingText(job) || dayMsg, null, true); });
      if (d.failed) { setStatus('✗ ' + (d.detail || 'Server error'), 'red'); break; }
      // The All-Star weekend was played instead of a day's games: off to
      // its results on the All-Star tab.
      if (d.all_star_game && throughBreak) {
        // On through the break; the results wait on the All-Stars tab.
        weekendPlayed = true;
        setStatus('★ All-Star Weekend played · on with the season…');
        continue;
      }
      if (d.all_star_game) {
        setStatus('★ All-Star weekend played · loading the results…');
        window.location.href = '/leagues/{{ league_id }}/allstar?weekend=1';
        return;
      }
      if (!d.games_played) {
        if (!d.games_remaining || d.games_remaining <= 0) break;
        setStatus('⚠ No games played', 'var(--amber)');
        break;
      }

      totalGames += d.games_played;
      remaining   = d.games_remaining;
      daysSimmed++;
      addToRun(run, d);

      // On to the next day's line while the tab refreshes; a single day
      // keeps its line until the result.
      if (multi) setStatus(simmingText(), null, true);

      var hasNews = showInjuryNews(d);

      // Every sim stops after the games of trade deadline day
      // (unless this run plays through it)
      var atDeadline = !skipDeadline && !!d.trade_deadline;
      if (atDeadline) window._simStop = true;
      // ...and the day a trade offer arrives (unless it plays on)
      var newOffer = !skipOffers && !!d.trade_offer;
      if (newOffer) window._simStop = true;
      // ...and when All-Star voting opens or the All-Stars are announced:
      // off to the All-Stars tab.
      if ((d.all_star_voting || d.all_stars) && !throughBreak) {
        window.location.href = '/leagues/{{ league_id }}/allstar';
        return;
      }

      // Stop on injury — read from window._stopOnInjury which persists across tab re-renders
      if (hasNews && (count === 'injury')) {
        window._simStop = true;
      }

      // Update topbar date
      if (d.current_date) {
        var dateEl = document.querySelector('.topbar-date');
        if (dateEl) dateEl.textContent = d.current_date;
      }

      // Update topbar state badge if league state changed
      if (d.league_state) {
        // Only the state word changes: the season pill keeps its
        // "3 of 25 ▾" and its settings panel.
        var badge = document.querySelector('.topbar-state');
        var label = badge && badge.querySelector('.topbar-state-label');
        if (badge && label) {
          var prevState = label.textContent.trim();
          label.textContent = d.league_state;
          badge.className = 'topbar-state state-' + d.league_state;
          var tabChangingStates = ['playoffs', 'offseason', 'draft', 'complete'];
          if (prevState !== d.league_state && tabChangingStates.includes(d.league_state)) {
            window.location.href = window.location.href;
            return;
          }
        }
      }

      // Refresh the open tab so it shows the day's results. Through htmx, so
      // script-built tabs (Lineup, Stats) are drawn again; it keeps the
      // Lineup's unsaved edits and the Leaders pane. The sidebar's in-place
      // pages count too: History's row for this season shows the GM's
      // record so far.
      if (document.querySelector('.tab-link.active, .side-link.active') && window.liveRefreshTab) {
        try { await window.liveRefreshTab(); } catch(e) {}
      }
      // Only re-enter sim mode if we're continuing
      if (!window._simStop && count !== 1) setSimMode(true);

      if (atDeadline) {
        setSimMode(false);
        setStatus('⏰ Trade deadline · trades close once the next day is played' + (runRecordText(run) ? ' · ' + runRecordText(run) : ''));
        return;
      }
      if (newOffer) {
        setSimMode(false);
        setStatus('📨 Trade offer · answer it on the Trades tab' + (runRecordText(run) ? ' · ' + runRecordText(run) : ''));
        return;
      }
      if (remaining <= 0) break;
      if (count !== 'season' && count !== 'injury' && daysSimmed >= count) break;

    } catch(err) {
      setStatus('✗ Error', 'red');
      console.error(err);
      break;
    }
  }

  // Done
  setSimMode(false);
  if (remaining !== null) {
    var parts = ['✓ ' + daysSimmed + (daysSimmed === 1 ? ' day' : ' days')];
    var record = runRecordText(run);
    // A GM without a team (shouldn't happen) gets the league's totals.
    parts.push(record || totalGames + ' games · ' + remaining + ' remaining');
    var notable = runNotable(run);
    if (notable) parts.push(notable);
    if (weekendPlayed) parts.push('★ All-Star Weekend played (All-Stars tab)');
    setStatus(parts.join(' · '));
  } else {
    setStatus('');
  }
}
// The sim owns the next-move button while it runs (refreshNextMove waits),
// then the button reloads: the league may be at the break or the playoffs.
async function schedSim(count) {
  if (window._nmBusy) return;
  window._nmBusy = true;
  var nm = document.getElementById('next-move');
  if (nm) nm.classList.add('nm-busy');
  try {
    await schedSimRun(count);
  } finally {
    window._nmBusy = false;
    if (nm) nm.classList.remove('nm-busy');
    if (window.refreshNextMove) window.refreshNextMove();
  }
}
window.schedSim = schedSim;

function schedStop() {
  window._simStop = true;
  var stop = getStop();
  if (stop) stop.textContent = 'Stopping…';
}
window.schedStop = schedStop;

})();
</script>
