[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball_manager"
version = "0.4.0"
description = "A baseball simulator"
authors = [
  { name = "Joshua Grigonis", email = "josh.grigonis@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
  "numpy",
  "scipy",
  "pydantic-settings",
  "fastapi",
  "uvicorn[standard]",
  "jinja2 @ git+https://github.com/pallets/jinja2.git",
  "python-multipart",
  "psycopg[binary]",
  "argon2-cffi",
]

[project.optional-dependencies]
dev = [
  "black",
  "coverage",
  "pyflakes",
  "pytest",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (run with -m slow)",
]

[tool.setuptools.packages.find]
where = ["."]
