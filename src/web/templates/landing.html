<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GM Sim</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
<div style="text-align:center;max-width:400px;padding:40px;">
  <div style="font-family:var(--font-display);font-size:64px;color:var(--amber);letter-spacing:.04em;line-height:1;">⚾<br>GM Sim</div>
  <p style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin:16px 0 32px;line-height:1.8;">
    Manage a franchise. Build a roster. Win a championship.
  </p>
  <form method="POST" action="/auth/guest" style="display:flex;flex-direction:column;gap:12px;">
    <div class="field">
      <label>Your name</label>
      <input type="text" name="display_name" placeholder="GM name" maxlength="40" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
      Play as Guest →
    </button>
  </form>
</div>
</body>
</html>
