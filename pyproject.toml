[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball_manager"
version = "0.5.6"
description = "A baseball simulator"
authors = [
  { name = "Joshua Grigonis", email = "josh.grigonis@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
  "numpy",
  "scipy",
  "pydantic-settings",
  "fastapi",
  "uvicorn[standard]",
  "jinja2 @ git+https://github.com/pallets/jinja2.git",
  "python-multipart",
  "psycopg[binary]",
  "argon2-cffi",
]

[project.optional-dependencies]
dev = [
  "black",
  "coverage",
  "httpx",
  "pyflakes",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (run with -m slow)",
    "veryslow: marks tests that take a significantly long time to run (run with -m veryslow)"
]

[tool.ruff.lint]
# Same checks as pyflake.sh (pyflakes) plus syntax errors.
select = ["F", "E9"]

[tool.setuptools.packages.find]
where = ["."]
