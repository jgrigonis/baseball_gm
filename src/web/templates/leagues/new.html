{# templates/leagues/new.html #}
{% extends "base.html" %}
{% block title %}New League — GM Sim{% endblock %}
{% block main %}
<div class="page-content"><div class="content-inner" style="max-width:520px;">
  <div class="page-header"><h1 class="page-title">New League</h1></div>
  <form method="POST" action="/leagues/new" style="display:flex;flex-direction:column;gap:16px;">
    <div class="row">
      <div class="field">
        <label>League Name</label>
        <input name="name" value="My League" required>
      </div>
      <div class="field">
        <label>Mode</label>
        <select name="mode">
          <option value="blitz">Blitz</option>
          <option value="longform" disabled style="color:var(--muted);">Long Form — Coming Soon</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Decision Window (sec)</label>
        <input name="decision_window_sec" type="number" value="120" min="30" max="600">
      </div>
      <div class="field">
        <label>Draft Window (sec)</label>
        <input name="draft_window_sec" type="number" value="300" min="60" max="1800">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Pace (multiplayer)</label>
        <select name="pace_control">
          <option value="timer">Timer: when everyone is ready or the window runs out</option>
          <option value="confirmed">Confirmed: only when everyone is ready</option>
          <option value="scheduled" disabled style="color:var(--muted);">Scheduled — Coming Soon</option>
        </select>
      </div>
      <div class="field">
        <label>Days per Sim Period</label>
        <input name="sim_period_days" type="number" value="3" min="1" max="30">
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button type="submit" class="btn btn-primary">Create League →</button>
      <a href="/leagues/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
