{# templates/dashboard/partials/_play_button.html #}
<div style="display:flex;align-items:center;gap:8px;">
  {% if league_state == 'playoffs' %}
  <a href="/leagues/{{ league_id }}/playoffs"
     hx-get="/leagues/{{ league_id }}/playoffs"
     hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="true"
     onclick="setTimeout(function(){ setActiveTab(document.querySelector('[hx-get*=\'/playoffs\']')); }, 50);"
     class="btn btn-primary" style="border-color:var(--amber);color:var(--amber);">
    🥇 Go to Playoffs
  </a>
  {% elif league_state in ('season', 'preseason') and not multiplayer %}
  <button class="btn btn-secondary" id="sched-stop-btn"
          onclick="schedStop()"
          style="display:none;border-color:var(--red);color:var(--red);">
    ■ Stop
  </button>
  <button class="btn btn-primary" id="sched-play-btn"
          onclick="schedSim(1)">
    ▶ Play Day
  </button>
  <button class="btn btn-secondary" id="sched-injury-btn"
          onclick="schedSim('injury')"
          style="font-size:11px;padding:5px 10px;">
    ▶ Until Injury
  </button>
  <button class="btn btn-secondary" id="sched-season-btn"
          onclick="schedSim('season')"
          style="font-size:11px;padding:5px 10px;">
    ▶▶ Full Season
  </button>
  {% endif %}
</div>
